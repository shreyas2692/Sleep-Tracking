name: Sleep Tracker
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.9"
    # App Store / device signing — select your Team in Xcode (Signing & Capabilities).
    CODE_SIGN_STYLE: Automatic
    # Fill once you see Team ID in Xcode → Settings → Accounts → Team, e.g. A1B2C3D4E5
    # DEVELOPMENT_TEAM: A1B2C3D4E5
targets:
  Sleep Tracker:
    type: application
    platform: iOS
    sources:
      - Sources
    resources:
      - path: Support/Assets.xcassets
    settings:
      base:
        # Reverse-DNS App ID (must match App Store Connect + developer.apple.com)
        PRODUCT_BUNDLE_IDENTIFIER: com.shreyas2692.sleeptracker
        PRODUCT_NAME: Sleep Tracker
        INFOPLIST_FILE: Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/SleepTracker.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: "YES"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
        # Standard HTTPS only — simplifies App Store export-compliance form
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
  SleepTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: Sleep Tracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shreyas2692.sleeptracker.tests
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGN_STYLE: Automatic
schemes:
  Sleep Tracker:
    build:
      targets:
        Sleep Tracker: all
        SleepTrackerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SleepTrackerTests
    archive:
      config: Release
