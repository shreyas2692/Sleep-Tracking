name: Sleep Tracker
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
targets:
  Sleep Tracker:
    type: application
    platform: iOS
    sources:
      - Sources
    resources:
      - path: Support/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.sleeptracker.app
        PRODUCT_NAME: Sleep Tracker
        INFOPLIST_FILE: Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/SleepTracker.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: "YES"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
  SleepTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: Sleep Tracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.sleeptracker.tests
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  Sleep Tracker:
    build:
      targets:
        Sleep Tracker: all
        SleepTrackerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SleepTrackerTests
