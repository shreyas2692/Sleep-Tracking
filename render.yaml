services:
  - type: web
    name: sleep-tracker
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 30
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: SLEEP_USERNAME
        value: sleep
      - key: SLEEP_PASSWORD
        sync: false
      - key: SLEEP_DB_PATH
        value: /var/data/sleep.db
      - key: SLEEP_TIMEZONE
        value: America/New_York
      - key: SESSION_COOKIE_SECURE
        value: "1"
    disk:
      name: sleep-data
      mountPath: /var/data
      sizeGB: 1
