<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Sleep Tracker</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11Z' fill='none' stroke='%23D97757' stroke-width='2'/%3E%3C/svg%3E">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: #FAF9F5;
      color: #141413;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 400px;
      background: #FFFFFF;
      border: 1px solid #E8E4DC;
      border-radius: 16px;
      box-shadow: 0 1px 3px rgba(20, 20, 19, .06), 0 8px 24px rgba(20, 20, 19, .06);
      padding: 40px 32px 32px;
    }
    .wordmark {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .wordmark svg {
      width: 26px;
      height: 26px;
      color: #D97757;
      flex: none;
    }
    .wordmark h1 {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 26px;
      font-weight: 500;
      letter-spacing: -0.01em;
    }
    .subtitle {
      margin: 8px 0 28px;
      text-align: center;
      color: #6E6B64;
      font-size: 14px;
    }
    .error {
      background: #FBEDEA;
      color: #B23B2E;
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 14px;
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 13px;
      color: #6E6B64;
      letter-spacing: 0.02em;
      margin: 0 0 6px 2px;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      font: inherit;
      font-size: 15px;
      color: #141413;
      background: #FFFFFF;
      border: 1px solid #D9D5CC;
      border-radius: 10px;
      margin-bottom: 18px;
    }
    input:focus {
      outline: none;
      border-color: #D97757;
      box-shadow: 0 0 0 3px rgba(217, 119, 87, .25);
    }
    button {
      width: 100%;
      padding: 12px;
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      color: #FFFFFF;
      background: #D97757;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 4px;
    }
    button:hover { background: #C15F3C; }
    button:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px rgba(217, 119, 87, .35);
    }
    .footnote {
      margin-top: 24px;
      color: #6E6B64;
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="wordmark">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11Z"
              fill="none" stroke="currentColor" stroke-width="1.8"
              stroke-linejoin="round" stroke-linecap="round"/>
      </svg>
      <h1>Sleep Tracker</h1>
    </div>
    <p class="subtitle">Sign in to your sleep log</p>
    {% if error %}
      <div class="error" role="alert">{{ error }}</div>
    {% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{ next_target }}">
      <label for="username">Username</label>
      <input id="username" name="username" type="text"
             autocomplete="username" autocapitalize="none"
             spellcheck="false" autofocus required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password"
             autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
  </main>
  <p class="footnote">Private by design — your data stays in your database.</p>
</body>
</html>
