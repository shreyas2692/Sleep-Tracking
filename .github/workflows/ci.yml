name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Verify dependencies
        run: python -m pip check

      - name: Run tests
        run: python -m pytest tests

      - name: Build production image
        run: docker build --platform linux/amd64 -t sleep-tracker:ci .

      - name: Smoke-test production image
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker rm -f sleep-tracker-ci >/dev/null 2>&1 || true; docker volume rm sleep-tracker-ci-data >/dev/null 2>&1 || true' EXIT
          docker volume create sleep-tracker-ci-data
          docker run --detach --name sleep-tracker-ci \
            --publish 127.0.0.1:5088:10000 \
            --mount type=volume,src=sleep-tracker-ci-data,dst=/data,volume-nocopy \
            --env SECRET_KEY=ci-secret \
            --env SLEEP_USERNAME=ci \
            --env SLEEP_PASSWORD=ci-password \
            sleep-tracker:ci
          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              http://127.0.0.1:5088/healthz >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs sleep-tracker-ci
              exit 1
            fi
            sleep 2
          done
          test "$(docker exec sleep-tracker-ci \
            awk '/^Uid:/{print $2}' /proc/1/status)" -ne 0
